# Deploys Firestore security rules + indexes to the live Firebase project.
#
# Why this exists: Vercel deploys the app but NOT firestore.rules — a rules
# change merged to main silently never reaches production without a manual
# `firebase deploy`. This workflow closes that gap.
#
# One-time setup (GitHub repo → Settings):
#   Secrets → Actions → new secret  FIREBASE_SERVICE_ACCOUNT_KEY
#     — the service-account JSON (the same value as the Vercel env var of the
#       same name). The account needs the "Firebase Rules Admin" and
#       "Cloud Datastore Index Admin" roles (or simply "Editor").
#   Variables → Actions → new variable  FIREBASE_PROJECT_ID
#     — the Firebase project id (same as NEXT_PUBLIC_FIREBASE_PROJECT_ID).
#
# Runs when rules/indexes change on main, or on demand from the Actions tab.

name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
  workflow_dispatch:

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fail early if the secret is missing
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Missing repo secret FIREBASE_SERVICE_ACCOUNT_KEY (Settings → Secrets and variables → Actions → Secrets tab)."; exit 1; fi

      - name: Write service-account credentials
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: printf '%s' "$KEY" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy rules + indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          # Optional overrides; when absent, the project id is read from the
          # service-account JSON itself (its `project_id` field).
          PROJECT_VAR: ${{ vars.FIREBASE_PROJECT_ID }}
          PROJECT_SECRET: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          PROJECT="${PROJECT_VAR:-$PROJECT_SECRET}"
          if [ -z "$PROJECT" ]; then
            PROJECT=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8')).project_id||'')")
          fi
          if [ -z "$PROJECT" ]; then
            echo "::error::Couldn't determine the Firebase project id — the service-account JSON has no project_id and no FIREBASE_PROJECT_ID variable/secret is set."; exit 1; fi
          echo "Deploying Firestore rules + indexes to project: $PROJECT"
          npx firebase-tools@15 deploy --only firestore --project "$PROJECT" --non-interactive --force

      - name: Scrub credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
