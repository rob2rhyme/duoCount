<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 158" role="img" aria-label="Pulling a report: pick a period (day through year, or custom), pick a location, preview what it includes, then export as PDF, CSV, or a printout.">
  <style>
    .bg{fill:#f3f7f1}.box{fill:#fff;stroke:#cfdccd;stroke-width:1.5}.gold{fill:#e2f1e4;stroke:#298050;stroke-width:1.5}
    .t{fill:#1a1c2e;font-family:ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial,sans-serif;font-weight:600}
    .m{fill:#6f6a5f;font-family:ui-sans-serif,system-ui,Helvetica,Arial,sans-serif}
    .a{stroke:#298050;stroke-width:1.75;fill:none}.ah{fill:#298050}
    @media (prefers-color-scheme:dark){.bg{fill:#1e2028}.box{fill:#262932;stroke:#3a3d49}.gold{fill:#33302a;stroke:#c59a4e}.t{fill:#e8e6df}.m{fill:#a2a09a}}
  </style>
  <rect class="bg" x="0" y="0" width="760" height="158" rx="12"/>
  <marker id="ah2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path class="ah" d="M0,0 L6,3 L0,6 Z"/></marker>
  <g text-anchor="middle" font-size="13.5">
    <rect class="box" x="16" y="40" width="150" height="70" rx="9"/>
    <text class="t" x="91" y="70">Pick a period</text>
    <text class="m" x="91" y="89" font-size="10.5">Day … Year · Custom</text>

    <rect class="box" x="196" y="40" width="150" height="70" rx="9"/>
    <text class="t" x="271" y="70">Pick a location</text>
    <text class="m" x="271" y="89" font-size="10.5">All · or one</text>

    <rect class="box" x="376" y="40" width="150" height="70" rx="9"/>
    <text class="t" x="451" y="70">Preview</text>
    <text class="m" x="451" y="89" font-size="10.5">“Will include”</text>

    <rect class="gold" x="556" y="40" width="188" height="70" rx="9"/>
    <text class="t" x="650" y="68">Export</text>
    <text class="m" x="650" y="88" font-size="11">PDF · CSV · Print</text>
  </g>
  <g>
    <line class="a" x1="168" y1="75" x2="192" y2="75" marker-end="url(#ah2)"/>
    <line class="a" x1="348" y1="75" x2="372" y2="75" marker-end="url(#ah2)"/>
    <line class="a" x1="528" y1="75" x2="552" y2="75" marker-end="url(#ah2)"/>
  </g>
  <text class="m" x="380" y="138" text-anchor="middle" font-size="11">A read-only snapshot for your records — it never changes the saved counts.</text>
</svg>
